<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guestbook</title>
<style>
:root{--bg:#f4f1ea;--fg:#1d2a1f;--muted:#6b7a6d;--accent:#2f7a4a;--card:#fffdf8;--line:#ddd6c8;--err:#b3412f}
@media (prefers-color-scheme:dark){:root{--bg:#121714;--fg:#e8efe9;--muted:#93a596;--accent:#5cc287;--card:#1a211c;--line:#2a332d;--err:#e07a68}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:32px 16px}
main{max-width:560px;margin:0 auto}
h1{margin:0 0 4px;font-size:1.8rem}
.sub{margin:0 0 24px;color:var(--muted)}
form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:12px;margin-bottom:28px}
input,textarea{width:100%;padding:10px 12px;font:inherit;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
textarea{min-height:90px;resize:vertical}
button{justify-self:start;padding:10px 20px;font:inherit;font-weight:600;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.error{color:var(--err);font-size:.9rem;min-height:1.1em;margin:0}
ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--muted);margin-bottom:6px}
.meta strong{color:var(--fg)}
.text{white-space:pre-wrap;word-wrap:break-word;margin:0}
.empty{color:var(--muted);text-align:center;padding:20px}
</style>
</head>
<body>
<main>
<h1>Guestbook</h1>
<p class="sub">Say hi and leave a note.</p>
<form id="form">
<input id="name" placeholder="Your name" maxlength="50" required>
<textarea id="text" placeholder="Your message" maxlength="500" required></textarea>
<p class="error" id="error"></p>
<button id="submit" type="submit">Sign guestbook</button>
</form>
<ul id="list"><li class="empty">Loading messages…</li></ul>
</main>
<script>
// Work out the API address: on deployinn the server lives at <name>-api.deployinn.com
const API = (() => {
  const h = location.hostname;
  const m = h.match(/^([^.]+)\.deployinn\.com$/);
  if (m) return 'https://' + m[1] + '-api.deployinn.com';
  if (h === 'localhost' || h === '127.0.0.1') return 'https://tgb-test-fullstack-api.deployinn.com';
  return '';
})();

const list = document.getElementById('list');
const form = document.getElementById('form');
const nameI = document.getElementById('name');
const textI = document.getElementById('text');
const errorEl = document.getElementById('error');
const submitB = document.getElementById('submit');

function when(iso){
  const d = new Date(iso);
  return d.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'});
}

function render(messages){
  list.innerHTML = '';
  if (!messages.length){
    list.innerHTML = '<li class="empty">No messages yet. Be the first!</li>';
    return;
  }
  for (const m of messages){
    const li = document.createElement('li');
    const meta = document.createElement('div'); meta.className = 'meta';
    const who = document.createElement('strong'); who.textContent = m.name;
    const at = document.createElement('span'); at.textContent = when(m.createdAt);
    meta.append(who, at);
    const p = document.createElement('p'); p.className = 'text'; p.textContent = m.text;
    li.append(meta, p);
    list.append(li);
  }
}

async function load(){
  try {
    const r = await fetch(API + 'https://tgb-test-fullstack-api.deployinn.com/api/messages');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    render(await r.json());
  } catch (e) {
    list.innerHTML = '<li class="empty">Could not load messages.</li>';
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.textContent = '';
  submitB.disabled = true;
  try {
    const r = await fetch(API + 'https://tgb-test-fullstack-api.deployinn.com/api/messages', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({name: nameI.value, text: textI.value})
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || 'Something went wrong.');
    textI.value = '';
    await load();
  } catch (err) {
    errorEl.textContent = err.message;
  } finally {
    submitB.disabled = false;
  }
});

load();
setInterval(load, 15000);
</script>
</body>
</html>
